services:
  - type: web
    name: truthlens-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/download_models.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://truthlens.vercel.app","http://localhost:5173"]'
      - key: DATABASE_URL
        fromDatabase:
          name: truthlens-db
          property: connectionString

databases:
  - name: truthlens-db
    plan: free
    databaseName: truthlens
    user: truthlens
