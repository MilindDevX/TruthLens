name: Train and validate text model

on:
  workflow_dispatch:
    inputs:
      version:
        description: New text-model version
        required: true
        default: v1.3.0
        type: string
      optuna_trials:
        description: Bounded Optuna trial count
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-training.txt
      - name: Install training dependencies
        run: python -m pip install --requirement ml/requirements-training.txt
      - name: Fetch the held-out LIAR evaluation data
        run: |
          mkdir -p ml/data/liar
          curl --fail --location --retry 3 --silent --show-error \
            https://www.cs.ucsb.edu/~william/data/liar_dataset.zip \
            --output /tmp/liar_dataset.zip
          unzip -j /tmp/liar_dataset.zip train.tsv valid.tsv test.tsv -d ml/data/liar
      - name: Train and enforce release gates
        run: |
          python ml/scripts/train_baseline.py \
            --version "${{ inputs.version }}" \
            --optuna-trials "${{ inputs.optuna_trials }}"
      - name: Upload passing candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: truthlens-text-model-${{ inputs.version }}
          path: models/text/${{ inputs.version }}
          if-no-files-found: error
          retention-days: 14
